# Unprivileged nginx serving the SPA and reverse-proxying /api to the backend on the internal network.
pid /tmp/nginx.pid;
worker_processes auto;
events { worker_connections 512; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  error_log /dev/stderr warn;
  sendfile on;
  server_tokens off;
  client_max_body_size 512k;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  server {
    listen 8080;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    # The SPA only talks to its own origin; no inline scripts. (Recharts/React inject inline styles.)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    # Re-resolve the backend through Docker's DNS so a recreated backend container (new IP) is
    # picked up without restarting nginx. A variable in proxy_pass forces run-time resolution.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
      set $backend_upstream backend:8000;
      proxy_pass http://$backend_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;   # overwrite, never append client-supplied values
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 90s;
    }
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location / { try_files $uri /index.html; add_header Cache-Control "no-store"; }
  }
}
